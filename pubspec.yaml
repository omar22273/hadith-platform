name: hadith_platform
description: منصة الحديث النبوي والتاريخ الإسلامي التفاعلية - مسار القوافل والوِرد اليومي ووضع السماع.
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  smooth_corner: ^1.1.1
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/catalogs/
    - assets/data/curriculum/
    - assets/data/hadith/nawawi40/
    - assets/fonts/OFL-Amiri.txt
    - assets/fonts/OFL-ReadexPro.txt
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Light.ttf
          weight: 300
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
