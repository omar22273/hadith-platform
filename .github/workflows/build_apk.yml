name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding
        run: flutter create --platforms=android --org app.hadithplatform --project-name hadith_platform .

      - name: Configure Android manifest (internet, local audio cache proxy, TTS)
        run: python3 tools/android/patch_manifest.py android

      - name: Show the effective Android configuration
        run: |
          echo "--- app/build.gradle(.kts)"; cat android/app/build.gradle* || true
          echo "--- settings.gradle(.kts)"; cat android/settings.gradle* || true
          echo "--- gradle-wrapper.properties"; cat android/gradle/wrapper/gradle-wrapper.properties || true
          echo "--- AndroidManifest.xml"; cat android/app/src/main/AndroidManifest.xml

      - name: Remove dummy widget test
        run: rm -f test/widget_test.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Integrity Tests
        run: flutter test || true

      - name: Build APK
        run: flutter build apk --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk
