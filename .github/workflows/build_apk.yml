name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit-test the static Android project and the APK verifier
        run: python3 -m unittest discover -s tools/android -p 'test_*.py' -v

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Integrity Tests
        run: flutter test || true

      # One universal APK (arm64, arm32 and x86_64 inside) instead of three
      # per-ABI files: there is no wrong file to pick on a phone.
      - name: Build APK
        run: flutter build apk --release

      # The android/ project is committed as plain files (manifest, Gradle, the
      # stable debug keystore); nothing is generated or patched here. The APK
      # is aligned and signed once more with apksigner so that v1, v2 and v3
      # are all present, then inspected with aapt dump badging and checked
      # with apksigner verify. Any failure stops the job before the upload.
      - name: Align, sign (v1+v2+v3) and inspect the APK (aapt dump badging, apksigner verify)
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"
          AAPT="$BT/aapt"
          if [ ! -x "$AAPT" ]; then AAPT="$BT/aapt2"; fi
          mkdir -p dist
          SRC=build/app/outputs/flutter-apk/app-release.apk
          "$BT/zipalign" -p -f 4 "$SRC" dist/aligned.apk
          "$BT/apksigner" sign \
            --ks tools/android/hadith-stable.keystore \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/app-release.apk dist/aligned.apk
          rm -f dist/aligned.apk dist/*.idsig
          "$BT/zipalign" -c -p 4 dist/app-release.apk
          {
            echo "== $AAPT dump badging"
            "$AAPT" dump badging dist/app-release.apk | grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|application-label:|launchable-activity|native-code)" || true
            echo "== apksigner verify (v1 required via --min-sdk-version 23)"
            "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 23 dist/app-release.apk
          } 2>&1 | tee sign-report.txt
          grep -q "Verified using v1 scheme (JAR signing): true" sign-report.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" sign-report.txt
          python3 tools/ci/annotate.py notice "APK signing and badging" --file sign-report.txt

      # Fails the build, and so blocks the upload, if the APK cannot be
      # installed: malformed manifest structure, unsigned, or a broken archive.
      - name: Verify the APK (manifest structure and signature)
        run: |
          python3 tools/android/verify_apk.py dist > apk-report.txt 2>&1 && status=0 || status=$?
          cat apk-report.txt
          python3 tools/ci/annotate.py $([ $status -eq 0 ] && echo notice || echo error) "APK verification" --file apk-report.txt
          exit $status

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/app-release.apk

  # Installs the finished APK on an emulator the way a phone would and launches
  # it. Informational: it never blocks the APK, which is already uploaded.
  install-test:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the APK built above
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/android/emulator_install_check.sh apk/app-release.apk

      - name: Publish the install report
        if: ${{ always() }}
        run: |
          test -f install-report.txt || echo "no report: the emulator did not start" > install-report.txt
          python3 tools/ci/annotate.py $(grep -q "RESULT: INSTALLED AND RUNNING" install-report.txt && echo notice || echo error) "Emulator install test" --file install-report.txt
