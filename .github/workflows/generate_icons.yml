# Generates the launcher icon files with flutter_launcher_icons and commits them back to the
# branch. Runs only on the dedicated branch chore/generate-icons (never on main), so the
# generated android/app/src/main/res files can be reviewed and then merged like any change.
name: Generate launcher icons

on:
  push:
    branches: [ 'chore/generate-icons' ]

permissions:
  contents: write

jobs:
  icons:
    name: Run flutter_launcher_icons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate the icons
        run: dart run flutter_launcher_icons 2>&1 | tee icons.txt

      - name: Report what changed
        run: |
          git status --short | tee changes.txt
          python3 tools/ci/annotate.py notice "flutter_launcher_icons" --file icons.txt
          python3 tools/ci/annotate.py notice "Changed files" --file changes.txt

      - name: Commit the generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android
          git commit -m "chore(android): launcher icons generated by flutter_launcher_icons [skip ci]" || echo "nothing to commit"
          git push
