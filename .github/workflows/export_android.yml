name: Export Android scaffold (temporary)

on:
  push:
    branches: [ export/android ]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter create --platforms=android --org app.hadithplatform --project-name hadith_platform .
      - run: python3 tools/android/patch_manifest.py android
      - run: flutter pub get
      - name: Describe the scaffold
        run: |
          flutter --version
          git status --short android | head -50
          find android -type f -not -path '*/build/*' -not -path '*/.gradle/*' | sort
          cat android/.gitignore
          cat android/gradle.properties
      - name: Push the scaffold to a branch
        run: |
          git config user.name "scaffold-export"
          git config user.email "scaffold-export@users.noreply.github.com"
          git checkout -b export/android-files
          git add -f android
          git reset -q android/local.properties android/.gradle android/build android/app/build 2>/dev/null || true
          git commit -qm "scaffold export"
          git push -f origin export/android-files
