name: Export Android scaffold (temporary)

on:
  push:
    branches: [ export/android ]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter create --platforms=android --org app.hadithplatform --project-name hadith_platform .
      - run: python3 tools/android/patch_manifest.py android
      - run: flutter pub get
      - name: Describe the scaffold
        run: |
          flutter --version
          git status --short android | head -50
          find android -type f -not -path '*/build/*' -not -path '*/.gradle/*' | sort
          cat android/.gitignore
          cat android/gradle.properties
      - run: tar czf android-scaffold.tgz android --exclude=android/.gradle --exclude=android/build --exclude=android/app/build
      - uses: actions/upload-artifact@v4
        with:
          name: android-scaffold
          path: android-scaffold.tgz
